    <title>React Five Nights</title>
    <!-- Keeping Tailwind CDN for simplicity in this specific setup, 
         though normally you'd install it via PostCSS in package.json -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Vt323&display=swap');
      
      body {
        background-color: #000;
        color: white;
        font-family: 'Vt323', monospace;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }
      
      /* CRT Scanline Effect */
      
      .scanlines {
        background: linear-gradient(
          to bottom,
          rgba(255,255,255,0),
          rgba(255,255,255,0) 50%,
          rgba(0,0,0,0.2) 50%,
          rgba(0,0,0,0.2)
        );
        background-size: 100% 4px;
        position: fixed;
        pointer-events: none;
        top: 0; left: 0; right: 0; bottom: 0;
        z-index: 50;
      }
      
      /* Static Noise Animation */
      
      @keyframes noise {
        0%, 100% { background-position: 0 0; }
        10% { background-position: -5% -10%; }
        20% { background-position: -15% 5%; }
        30% { background-position: 7% -25%; }
        40% { background-position: 20% 25%; }
        50% { background-position: -25% 10%; }
        60% { background-position: 15% 5%; }
        70% { background-position: 0% 15%; }
        80% { background-position: 25% 35%; }
        90% { background-position: -10% 10%; }
      }
      
      .static-noise {
        position: absolute;
        top: -50%;
        left: -50%;
        right: -50%;
        bottom: -50%;
        width: 200%;
        height: 200vh;
        background: transparent url('https://cdnjs.cloudflare.com/ajax/libs/paper.js/0.12.17/assets/js/paper-full.min.js') repeat 0 0; 
        /* The URL above is a dummy, in real CSS we use a base64 noise pattern. */
        animation: noise 0.2s infinite;
        opacity: 0.15;
        pointer-events: none;
        z-index: 10;
      }
      
      /* Camera Pan Animation for Office */
      
      @keyframes pan {
        0% { transform: translateX(-2%); }
        50% { transform: translateX(2%); }
        100% { transform: translateX(-2%); }
      }
      
      .perspective-pan {
        animation: pan 10s ease-in-out infinite;
      }
      
      /* Button Glow */
      
      .btn-glow:active {
        box-shadow: 0 0 15px #ff0000, inset 0 0 10px #ff0000;
        border-color: #ff5555;
      }
    </style>
